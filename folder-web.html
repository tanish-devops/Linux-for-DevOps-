<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux File Structure</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: rgba(255, 255, 255, 0.08);
            --text: #e2e4ec;
            --muted: #8b8fa8;
            --purple-fill: #2e2356;
            --purple-stroke: #7f77dd;
            --purple-text: #cbc8f6;
            --teal-fill: #0c3328;
            --teal-stroke: #1d9e75;
            --teal-text: #9fe1cb;
            --blue-fill: #0c2642;
            --blue-stroke: #378add;
            --blue-text: #b5d4f4;
            --gray-fill: #242420;
            --gray-stroke: #5f5e5a;
            --gray-text: #d3d1c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 32px 24px;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            font-weight: 500;
            color: var(--purple-text);
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 32px;
            letter-spacing: 0.08em;
        }

        svg {
            display: block;
            max-width: 860px;
            margin: 0 auto;
        }

        .node {
            cursor: pointer;
        }

        .node rect {
            transition: filter 0.15s;
        }

        .node:hover rect {
            filter: brightness(1.25);
        }

        .legend {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.04em;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .info-box {
            max-width: 860px;
            margin: 24px auto 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
            font-size: 13px;
            color: var(--text);
            min-height: 56px;
            line-height: 1.6;
            transition: opacity 0.2s;
        }

        .info-box strong {
            color: var(--purple-text);
        }

        .info-path {
            color: var(--teal-text);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <h1>Linux File Structure</h1>
    <p class="subtitle">Click any directory to learn more</p>

    <svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
                orient="auto-start-reverse">
                <path d="M2 1L8 5L2 9" fill="none" stroke="#7f77dd" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </marker>
        </defs>

        <!-- Root -->
        <g class="node"
            onclick="showInfo('/', 'The root of the entire filesystem. Every single file and directory on a Linux system lives under /. There is only one root — even external drives are mounted as subdirectories here.')">
            <rect x="360" y="16" width="140" height="48" rx="8" fill="#2e2356" stroke="#7f77dd" stroke-width="1" />
            <text x="430" y="36" text-anchor="middle" font-size="14" font-weight="500" fill="#cbc8f6"
                font-family="Courier New">/ (root)</text>
            <text x="430" y="53" text-anchor="middle" font-size="11" fill="#afa9ec" font-family="Courier New">Everything
                starts here</text>
        </g>

        <!-- Root to spread -->
        <line x1="430" y1="64" x2="430" y2="96" stroke="#7f77dd" stroke-width="0.8" stroke-dasharray="3 3" />

        <!-- Spread line row 1 -->
        <line x1="80" y1="96" x2="780" y2="96" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />

        <!-- Verticals to row 1 -->
        <line x1="80" y1="96" x2="80" y2="116" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />
        <line x1="195" y1="96" x2="195" y2="116" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />
        <line x1="310" y1="96" x2="310" y2="116" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />
        <line x1="430" y1="96" x2="430" y2="116" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />
        <line x1="550" y1="96" x2="550" y2="116" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />
        <line x1="665" y1="96" x2="665" y2="116" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />
        <line x1="780" y1="96" x2="780" y2="116" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />

        <!-- Row 1 — common dirs (teal) -->
        <g class="node"
            onclick="showInfo('/bin','Essential user command binaries. Contains programs everyone needs: ls, cp, mv, cat, grep, bash. These must be available even before other filesystems are mounted — so /bin is always on the root partition.')">
            <rect x="40" y="116" width="80" height="48" rx="8" fill="#0c3328" stroke="#1d9e75" stroke-width="1" />
            <text x="80" y="136" text-anchor="middle" font-size="14" font-weight="500" fill="#9fe1cb"
                font-family="Courier New">/bin</text>
            <text x="80" y="153" text-anchor="middle" font-size="11" fill="#5dcaa5" font-family="Courier New">Core
                binaries</text>
        </g>

        <g class="node"
            onclick="showInfo('/etc','System-wide configuration files. No binaries here — only text config: /etc/passwd (users), /etc/fstab (filesystems), /etc/hosts (hostname map), /etc/ssh/ (SSH config), and hundreds more. The sysadmin\'s home.')">
            <rect x="155" y="116" width="80" height="48" rx="8" fill="#0c3328" stroke="#1d9e75" stroke-width="1" />
            <text x="195" y="136" text-anchor="middle" font-size="14" font-weight="500" fill="#9fe1cb"
                font-family="Courier New">/etc</text>
            <text x="195" y="153" text-anchor="middle" font-size="11" fill="#5dcaa5" font-family="Courier New">Config
                files</text>
        </g>

        <g class="node"
            onclick="showInfo('/home','Personal directories for regular users. Each user gets their own subdirectory: /home/alice, /home/bob. Contains documents, downloads, dotfiles (.bashrc, .vimrc), and everything the user owns.')">
            <rect x="270" y="116" width="80" height="48" rx="8" fill="#0c3328" stroke="#1d9e75" stroke-width="1" />
            <text x="310" y="136" text-anchor="middle" font-size="14" font-weight="500" fill="#9fe1cb"
                font-family="Courier New">/home</text>
            <text x="310" y="153" text-anchor="middle" font-size="11" fill="#5dcaa5" font-family="Courier New">User
                files</text>
        </g>

        <g class="node"
            onclick="showInfo('/var','Variable data that grows during operation. Contains logs (/var/log), mail spools (/var/mail), databases (/var/lib), and print queues. The \"
            V\" stands for variable — this directory changes constantly at runtime.')">
            <rect x="390" y="116" width="80" height="48" rx="8" fill="#0c3328" stroke="#1d9e75" stroke-width="1" />
            <text x="430" y="136" text-anchor="middle" font-size="14" font-weight="500" fill="#9fe1cb"
                font-family="Courier New">/var</text>
            <text x="430" y="153" text-anchor="middle" font-size="11" fill="#5dcaa5" font-family="Courier New">Variable
                data</text>
        </g>

        <g class="node"
            onclick="showInfo('/tmp','Temporary files. Any process or user can create files here. Typically cleared on every reboot. Never store anything important here — it may vanish. Some systems use tmpfs (RAM-backed) for /tmp for speed.')">
            <rect x="510" y="116" width="80" height="48" rx="8" fill="#0c3328" stroke="#1d9e75" stroke-width="1" />
            <text x="550" y="136" text-anchor="middle" font-size="14" font-weight="500" fill="#9fe1cb"
                font-family="Courier New">/tmp</text>
            <text x="550" y="153" text-anchor="middle" font-size="11" fill="#5dcaa5" font-family="Courier New">Temp
                files</text>
        </g>

        <g class="node"
            onclick="showInfo('/usr','Unix System Resources. Contains the majority of user-land programs and data: /usr/bin (most executables), /usr/lib (libraries), /usr/share (arch-independent data), /usr/local (locally compiled software).')">
            <rect x="625" y="116" width="80" height="48" rx="8" fill="#0c3328" stroke="#1d9e75" stroke-width="1" />
            <text x="665" y="136" text-anchor="middle" font-size="14" font-weight="500" fill="#9fe1cb"
                font-family="Courier New">/usr</text>
            <text x="665" y="153" text-anchor="middle" font-size="11" fill="#5dcaa5" font-family="Courier New">User
                programs</text>
        </g>

        <g class="node"
            onclick="showInfo('/dev','Device files. Linux represents hardware as files here. /dev/sda is your first hard disk, /dev/null is the void (discards everything), /dev/random generates random bytes, /dev/tty is your terminal. Everything is a file.')">
            <rect x="740" y="116" width="80" height="48" rx="8" fill="#0c3328" stroke="#1d9e75" stroke-width="1" />
            <text x="780" y="136" text-anchor="middle" font-size="14" font-weight="500" fill="#9fe1cb"
                font-family="Courier New">/dev</text>
            <text x="780" y="153" text-anchor="middle" font-size="11" fill="#5dcaa5" font-family="Courier New">Device
                files</text>
        </g>

        <!-- /usr sub-tree -->
        <line x1="665" y1="164" x2="625" y2="222" stroke="rgba(255,255,255,0.08)" stroke-width="0.5" />
        <line x1="665" y1="164" x2="705" y2="222" stroke="rgba(255,255,255,0.08)" stroke-width="0.5" />

        <g class="node"
            onclick="showInfo('/usr/bin','Non-essential user binaries. Programs installed by the OS or package manager that aren\'t needed for booting: python3, git, vim, curl, etc. On modern systems, /bin is often a symlink to /usr/bin.')">
            <rect x="578" y="222" width="94" height="44" rx="8" fill="#242420" stroke="#5f5e5a" stroke-width="1" />
            <text x="625" y="240" text-anchor="middle" font-size="13" font-weight="500" fill="#d3d1c7"
                font-family="Courier New">/usr/bin</text>
            <text x="625" y="256" text-anchor="middle" font-size="11" fill="#888780" font-family="Courier New">Extra
                programs</text>
        </g>

        <g class="node"
            onclick="showInfo('/usr/lib','Shared libraries and kernel modules for programs in /usr/bin and /usr/sbin. Also contains /usr/lib/systemd (service definitions), /usr/lib/python3, and architecture-specific compiled code.')">
            <rect x="680" y="222" width="94" height="44" rx="8" fill="#242420" stroke="#5f5e5a" stroke-width="1" />
            <text x="727" y="240" text-anchor="middle" font-size="13" font-weight="500" fill="#d3d1c7"
                font-family="Courier New">/usr/lib</text>
            <text x="727" y="256" text-anchor="middle" font-size="11" fill="#888780" font-family="Courier New">Shared
                libs</text>
        </g>

        <!-- Row 2 — system/virtual dirs (blue) -->
        <!-- Spread line -->
        <line x1="80" y1="316" x2="780" y2="316" stroke="rgba(255,255,255,0.07)" stroke-width="0.5" />
        <line x1="80" y1="316" x2="80" y2="336" stroke="rgba(255,255,255,0.07)" stroke-width="0.5" />
        <line x1="195" y1="316" x2="195" y2="336" stroke="rgba(255,255,255,0.07)" stroke-width="0.5" />
        <line x1="310" y1="316" x2="310" y2="336" stroke="rgba(255,255,255,0.07)" stroke-width="0.5" />
        <line x1="430" y1="316" x2="430" y2="336" stroke="rgba(255,255,255,0.07)" stroke-width="0.5" />
        <line x1="550" y1="316" x2="550" y2="336" stroke="rgba(255,255,255,0.07)" stroke-width="0.5" />
        <line x1="665" y1="316" x2="665" y2="336" stroke="rgba(255,255,255,0.07)" stroke-width="0.5" />
        <line x1="780" y1="316" x2="780" y2="336" stroke="rgba(255,255,255,0.07)" stroke-width="0.5" />
        <!-- dashed from root -->
        <line x1="430" y1="64" x2="430" y2="316" stroke="#7f77dd" stroke-width="0.5" stroke-dasharray="4 4"
            opacity="0.3" />

        <g class="node"
            onclick="showInfo('/proc','A virtual filesystem — not real files on disk. The kernel generates its contents on-the-fly. /proc/cpuinfo shows CPU details, /proc/meminfo shows RAM, /proc/1234/ shows info about process 1234. Reading these queries the kernel directly.')">
            <rect x="40" y="336" width="80" height="48" rx="8" fill="#0c2642" stroke="#378add" stroke-width="1" />
            <text x="80" y="356" text-anchor="middle" font-size="14" font-weight="500" fill="#b5d4f4"
                font-family="Courier New">/proc</text>
            <text x="80" y="373" text-anchor="middle" font-size="11" fill="#85b7eb"
                font-family="Courier New">Kernel/process</text>
        </g>

        <g class="node"
            onclick="showInfo('/sys','Another virtual filesystem (sysfs). Exposes the kernel\'s view of hardware devices, drivers, and the device tree. Used to tune kernel parameters at runtime — e.g. echo 1 > /sys/class/leds/led0/brightness turns on an LED.')">
            <rect x="155" y="336" width="80" height="48" rx="8" fill="#0c2642" stroke="#378add" stroke-width="1" />
            <text x="195" y="356" text-anchor="middle" font-size="14" font-weight="500" fill="#b5d4f4"
                font-family="Courier New">/sys</text>
            <text x="195" y="373" text-anchor="middle" font-size="11" fill="#85b7eb" font-family="Courier New">Hardware
                info</text>
        </g>

        <g class="node"
            onclick="showInfo('/boot','Files needed to boot the OS. Contains the kernel image (vmlinuz), initial RAM disk (initrd/initramfs), and the bootloader config (GRUB). Without this, the system can\'t start. Usually a small, separate partition.')">
            <rect x="270" y="336" width="80" height="48" rx="8" fill="#0c2642" stroke="#378add" stroke-width="1" />
            <text x="310" y="356" text-anchor="middle" font-size="14" font-weight="500" fill="#b5d4f4"
                font-family="Courier New">/boot</text>
            <text x="310" y="373" text-anchor="middle" font-size="11" fill="#85b7eb" font-family="Courier New">Boot
                files</text>
        </g>

        <g class="node"
            onclick="showInfo('/sbin','System binaries for root/admins only. Programs for system maintenance: fdisk (partition tool), iptables (firewall), ifconfig, fsck (filesystem check). Regular users can\'t (and shouldn\'t) run most of these.')">
            <rect x="390" y="336" width="80" height="48" rx="8" fill="#0c2642" stroke="#378add" stroke-width="1" />
            <text x="430" y="356" text-anchor="middle" font-size="14" font-weight="500" fill="#b5d4f4"
                font-family="Courier New">/sbin</text>
            <text x="430" y="373" text-anchor="middle" font-size="11" fill="#85b7eb" font-family="Courier New">Admin
                binaries</text>
        </g>

        <g class="node"
            onclick="showInfo('/lib','Essential shared libraries for /bin and /sbin. The C standard library (libc.so), kernel modules (/lib/modules/), and dynamic linker live here. Without /lib, most binaries in /bin won\'t run.')">
            <rect x="510" y="336" width="80" height="48" rx="8" fill="#0c2642" stroke="#378add" stroke-width="1" />
            <text x="550" y="356" text-anchor="middle" font-size="14" font-weight="500" fill="#b5d4f4"
                font-family="Courier New">/lib</text>
            <text x="550" y="373" text-anchor="middle" font-size="11" fill="#85b7eb" font-family="Courier New">Core
                libraries</text>
        </g>

        <g class="node"
            onclick="showInfo('/mnt','Temporary mount point for manually mounted filesystems. When you plug in a USB drive and mount it yourself (mount /dev/sdb1 /mnt), it appears here. /media is the modern equivalent for auto-mounted removable devices.')">
            <rect x="620" y="336" width="80" height="48" rx="8" fill="#0c2642" stroke="#378add" stroke-width="1" />
            <text x="660" y="356" text-anchor="middle" font-size="14" font-weight="500" fill="#b5d4f4"
                font-family="Courier New">/mnt</text>
            <text x="660" y="373" text-anchor="middle" font-size="11" fill="#85b7eb" font-family="Courier New">Mount
                point</text>
        </g>

        <g class="node"
            onclick="showInfo('/opt','Optional third-party software. Large standalone applications that don\'t fit neatly into /usr — like Google Chrome, Zoom, or proprietary software — install here. Each app typically gets its own subdirectory: /opt/google/chrome.')">
            <rect x="740" y="336" width="80" height="48" rx="8" fill="#0c2642" stroke="#378add" stroke-width="1" />
            <text x="780" y="356" text-anchor="middle" font-size="14" font-weight="500" fill="#b5d4f4"
                font-family="Courier New">/opt</text>
            <text x="780" y="373" text-anchor="middle" font-size="11" fill="#85b7eb" font-family="Courier New">Optional
                apps</text>
        </g>

        <!-- Row labels -->
        <text x="16" y="148" font-size="10" fill="#5f5e5a" font-family="Courier New" writing-mode="tb"
            transform="rotate(-90,16,148)">common</text>
        <text x="16" y="368" font-size="10" fill="#5f5e5a" font-family="Courier New" writing-mode="tb"
            transform="rotate(-90,16,368)">system</text>

        <!-- Divider label -->
        <text x="430" y="308" text-anchor="middle" font-size="10" fill="#5f5e5a" font-family="Courier New"
            letter-spacing="0.1em">── SYSTEM / VIRTUAL DIRS ──</text>

        <!-- Footer note -->
        <text x="430" y="470" text-anchor="middle" font-size="11" fill="#5f5e5a" font-family="Courier New">Click any
            directory node to learn more</text>
    </svg>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot" style="background:#2e2356;border:1px solid #7f77dd"></div>Root
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#0c3328;border:1px solid #1d9e75"></div>Common directories
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#242420;border:1px solid #5f5e5a"></div>Sub-directories
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#0c2642;border:1px solid #378add"></div>Virtual / system dirs
        </div>
    </div>

    <div class="info-box" id="info-box">
        <strong>Linux Filesystem Hierarchy Standard (FHS)</strong> — A single tree rooted at <span
            class="info-path">/</span>. Every file, device, and process is reachable from here. Click any node above to
        explore a directory.
    </div>

    <script>
        function showInfo(path, desc) {
            const box = document.getElementById('info-box');
            box.innerHTML = '<span class="info-path">' + path + '</span> — ' + desc;
        }
    </script>
</body>

</html>
